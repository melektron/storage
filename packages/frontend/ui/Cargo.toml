[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
#dioxus-primitives = { workspace = true }
dioxus-free-icons = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
el_std = { workspace = true, features = [ "clone" ] }

web-sys = { workspace = true, optional = true }


api = { workspace = true }


[features]
# web tells us that we can use web-sys
web = [
    "dep:web-sys"
    # do we need dioxus/web here?
]
server = ["dioxus/server", "api/server"]
