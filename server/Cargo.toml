[workspace]
members = [".", "entity", "migration"]

[package]
name = "storage-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# local
migration = { path = "migration" }
entity = { path = "entity" }

# external
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["ws"] }
axum-client-ip = "1.3.1"
clap = { version = "4.6.1", features = ["derive"] }
el_std = { version = "0.2.0", path = "../libs/el_std_rs/el_std" }
futures = "0.3.32"
log = "0.4.33"
sea-orm = { version = "2.0.0-rc", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
shell-words = "1.1.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
axum-reverse-proxy = { version = "1.3.0", optional = true, default-features = false }

[features]
dev-proxy = ["dep:axum-reverse-proxy"]
